<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilocano Flashcards</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff5e6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .learn_pampanga {
            font-family: "Georgia", sans-serif;
            background: #fff8df;
            padding: 30px 50px;
            padding-left: 140px;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.6s ease;
            z-index: 5;
        }

        .learn_pampanga.show {
            transform: translateY(0);
        }

/* SIDEBAR STYLES */
        .sidebar {
            width: 100px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            gap: 20px;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar .icon {
            width: 80px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sidebar .icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            width: 100%;
        }

        .sidebar ul li {
            width: 100%;
            margin-bottom: 35px;
            text-align: center;
        }

        .sidebar ul li a {
            color: #e59d2c;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar Hover Effect */
        .sidebar ul li a:hover {
            transform: scale(1.15);
            background-color: #fff8df;
            color: #8a3b08;
        }

        .sidebar ul li a .material-icons {
            font-size: 36px;
            transition: transform 0.3s ease;
        }

        .sidebar ul li a:hover .material-icons {
            transform: rotate(-5deg);
        }

        .nav-label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: "Georgia", sans-serif;
            letter-spacing: 1px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-family: 'bright DEMO', Georgia, serif;
            color: #2e4365;
            font-size: 45px;
            margin: 0;
            font-weight: bold;
        }

        /* SECTION DIVIDERS */
        .section-divider {
            width: auto;
            max-width: 250px;
            background: #8a3b08;
            color: #fff;
            padding: 10px 25px;
            font-size: 20px;
            margin: 20px 0 10px 0;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            grid-column: 1 / -1;
        }

        /* BUTTONS */
        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .play-button,
        .flip-button,
        .nav-btn,
        .back-btn {
            padding: 10px 18px;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .play-button,
        .nav-btn {
            background-color: #e59d2c;
            color: white;
        }

        .flip-button,
        .back-btn {
            background-color: #2e4365;
            color: white;
        }

        .play-button:hover,
        .nav-btn:hover {
            background-color: #c97f14;
            transform: translateY(-2px);
        }

        .flip-button:hover,
        .back-btn:hover {
            background-color: #1d2f4d;
            transform: translateY(-2px);
        }

        /* FLASHCARDS GRID */
        .flashcards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .flashcard {
            height: 165px;
            border: 4px solid #2e4365;
            border-radius: 22px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard:hover .card-inner,
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 18px;
            padding: 10px;
        }

        .card-front {
            background-color: #2e4365;
            border: 4px solid #ffffff;
        }

        .card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-front .upper-text {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffffff;
        }

        .card-back .upper-text {
            font-size: 1.4em;
            font-weight: bold;
            color: #2e4365;
        }

        .card-front .separator {
            width: 60%;
            margin: 8px auto;
            border-top: 2px solid #5f7fa8;
        }

        .card-back .separator {
            width: 60%;
            margin: 8px auto;
            border-top: 2px solid #c7d6ea;
        }

        .card-front .lower-text {
            font-size: 0.9em;
            color: #8a3b08;
            font-style: italic;
            color: #dbe6f2;
        }

        .card-back .lower-text {
            font-size: 0.9em;
            color: #8a3b08;
            font-style: italic;
        }

        /* DETAILS SECTION */
        .details-section {
            display: none;
            max-width: 1000px;
            margin: 30px auto;
            position: relative;
        }

        .main-container {
            display: flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap: wrap;
            gap: 40px;
            border: 4px solid #8a3b08;
            border-radius: 25px;
            padding: 50px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .dialect-word {
            font-size: 48px;
            font-weight: bold;
            color: #2e4365;
            margin-bottom: 20px;
        }

        .tagalog-word {
            font-size: 22px;
            color: #8a3b08;
            margin: 15px 0;
            margin-bottom:10px;
        }

        .image-container {
            flex: 1;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            background: #eee;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: inherit;
        }

        .english-container {
            margin-top: 20px;
            border: 3px solid #2e4365;
            border-radius: 18px;
            padding: 15px;
            background: #f5f5f5;
            font-size: 18px;
            line-height: 1.6;
        }

        .example-text {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            border-left: 4px solid #e59d2c;
            padding-left: 15px;
            margin-top: 10px;
        }

        .pronunciation-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size:18px;
            font-style:italic;
            color:#555;
            margin:8px 0;
        }

        .audio-icon {
            font-size: 28px;
            color: #e59d2c;
            cursor: pointer;
            transition: 0.3s;
        }

        .audio-icon:hover {
            color: #2e4365;
            transform: scale(1.1);
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .back-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="icon"><img src="../assets/images/salinify.png" alt="Logo"></div>
        <ul>
            <li><a href="home.html"><span class="material-icons">home</span><span class="nav-label">Home</span></a></li>
            <li><a href="classes.html"><span class="material-icons">school</span><span
                        class="nav-label">Origin</span></a></li>
            <li><a href="learn-ui.html"><span class="material-icons">menu_book</span><span
                        class="nav-label">Dialect</span></a></li>
            <li><a href="play-ui.html"><span class="material-icons">sports_esports</span><span
                        class="nav-label">Play</span></a></li>
        </ul>
    </div>

    <div class="learn_pampanga">
        <div class="header" id="mainHeader">
            <h1>Ilocano</h1>
            <div class="header-buttons">
                <button class="flip-button" id="flipAllBtn">👀 Show All</button>
                <button class="play-button" onclick="window.location.href='play-ui.html'">🎮 Play</button>
            </div>
        </div>

        <div class="flashcards-container" id="flashcards"></div>

        <div class="details-section" id="details">
            <div class="back-header">
                <button class="back-btn" onclick="goBack()">⬅ Back to Flashcards</button>
            </div>

            <div class="main-container">
                <div style="flex: 1.5;">
                    <div class="dialect-word" id="dialectWord"></div>

                    <div class="pronunciation-wrapper">
                        <div class="lower-text" id="pronunciationText" style="font-size: 1.3em;"></div>
                        <span class="audio-icon material-icons" id="playBtn">volume_up</span>
                        <audio id="audioElement"></audio>
                    </div>

                    <div class="tagalog-word" id="tagalogWord"></div>
                    <div class="example-text" id="exampleText"></div>
                </div>
                <div class="image-container">
                    <img id="wordImage" src="" alt="Word Image">
                </div>
            </div>

            <div class="english-container" id="englishText"></div>

            <div class="button-group">
                <button class="nav-btn" onclick="prevWord()">⬅ Previous Word</button>
                <button class="nav-btn" onclick="nextWord()">Next Word ➡</button>
            </div>
        </div>
    </div>

    <script>
const words = [
            { cat: "Nouns", dialect: "Ínan", pron: "ee-nan", tagalog: "Nanay", english: "Mother", example: "Ilocano: Tinawag ko ang aking <b>Ínan</b> para kumain.", image: "../assets/images/ina.png", audio: "../assets/audio/inan.mp3" },
            { cat: "Nouns", dialect: "Tatáng", pron: "ta-tang", tagalog: "Tatay", english: "Father", example: "Ilocano: Kasama ko si <b>Tatáng</b> sa paglalakad kanina.", image: "../assets/images/ama.png", audio: "../assets/audio/tatang2.mp3" },
            { cat: "Nouns", dialect: "Manáng", pron: "ma-nang", tagalog: "Ate", english: "Older Sister", example: "Ilocano: Binilhan ako ng aking <b>Manáng</b> ng pagkain.", image: "../assets/images/ate.png", audio: "../assets/audio/manang.mp3" },
            { cat: "Nouns", dialect: "Manóng", pron: "ma-nong", tagalog: "Kuya", english: "Older Brother", example: "Ilocano: Naglaro kami ni <b>Manóng</b> sa labas.", image: "../assets/images/kuya.png", audio: "../assets/audio/manong.mp3" },


            // Adjectives
            { cat: "Adjectives", dialect: "Napudót", pron: "na-pu-dot", tagalog: "Mainit", english: "Hot", example: "Ilocano: <b>Napudót</b> ang kape kaya dahan-dahan kong ininom.", image: "../assets/images/hot2.png", audio: "../assets/audio/napudot.mp3" },
            { cat: "Adjectives", dialect: "Nalamíis", pron: "na-la-mees", tagalog: "Malamig", english: "Cold", example: "Ilocano: <b>Nalamíis</b> ang tubig sa ref.", image: "../assets/images/cold.png", audio: "../assets/audio/nalamiis.mp3" },
            { cat: "Adjectives", dialect: "Napíntas", pron: "na-pin-tas", tagalog: "Maganda", english: "Beautiful", example: "Ilocano: <b>Napíntas</b> ang damit na suot niya.", image: "../assets/images/beautiful.png", audio: "../assets/audio/napintas.mp3" },
            { cat: "Adjectives", dialect: "Natarakí", pron: "na-ta-ra-kee", tagalog: "Gwapo", english: "Handsome", example: "Ilocano: <b>Natarakí</b> ang artista sa palabas.", image: "../assets/images/handsome.png", audio: "../assets/audio/nataraki.mp3" },


            // Greetings
            { cat: "Greetings", dialect: "Naimbág nga bigát", pron: "na-im-bag nga bee-gat", tagalog: "Magandang Umaga", english: "Good Morning", example: "Ilocano: <b>Naimbág nga bigát</b>, tara na sa eskwela.", image: "../assets/images/morning.png", audio: "../assets/audio/bigat.mp3" },
            { cat: "Greetings", dialect: "Agyamanák unay", pron: "ag-ya-ma-nak u-nay", tagalog: "Maraming salamat", english: "Thank you very much", example: "Ilocano: <b>Agyamanák unay</b>, malaking tulong ito.", image: "../assets/images/thanks.png", audio: "../assets/audio/unay.mp3" },
            { cat: "Greetings", dialect: "Naimbág nga malém", pron: "na-im-bag nga ma-lem", tagalog: "Magandang Hapon", english: "Good Afternoon", example: "Ilocano: <b>Naimbág nga malém</b>, kumain ka na ba?", image: "../assets/images/afternoon.png", audio: "../assets/audio/malem.mp3" },
            { cat: "Greetings", dialect: "Naimbág nga rabí-i", pron: "na-im-bag nga ra-bee-i", tagalog: "Magandang Gabi", english: "Good Evening", example: "Ilocano: <b>Naimbág nga rabí-i</b>, matulog ka na mamaya.", image: "../assets/images/evening.png", audio: "../assets/audio/rabi.mp3" },


            // Foods
            { cat: "Foods", dialect: "Makan", pron: "ma-kan", tagalog: "Pagkain", english: "Food", example: "Ilocano: Marami kaming <b>Makan</b> sa handaan.", image: "../assets/images/food.png", audio: "../assets/audio/makan.mp3" },
            { cat: "Foods", dialect: "Naténg", pron: "na-teng", tagalog: "Gulay", english: "Vegetable", example: "Ilocano: Niluto ni nanay ang <b>Naténg</b> kanina.", image: "../assets/images/vegetable.png", audio: "../assets/audio/nateng.mp3" },
            { cat: "Foods", dialect: "Bunga", pron: "boon-ga", tagalog: "Prutas", english: "Fruits", example: "Ilocano: Kumain ako ng <b>Bunga</b> pagkatapos ng tanghalian.", image: "../assets/images/fruits.png", audio: "../assets/audio/bunga.mp3" },
            { cat: "Foods", dialect: "Inapuy", pron: "i-na-puy", tagalog: "Kanin", english: "Cooked Rice", example: "Ilocano: Maputi ang <b>Nasi</b> na sinaing namin.", image: "../assets/images/cooked_rice.png", audio: "../assets/audio/inapuy.mp3" },


            // Nature
            { cat: "Nature", dialect: "Bantáy", pron: "ban-tay", tagalog: "Bundok", english: "Mountain", example: "Ilocano: Malayo ang <b>Bantáy</b> pero kita pa rin.", image: "../assets/images/mountain.png", audio: "../assets/audio/bantay.mp3" },
            { cat: "Nature", dialect: "Baybay", pron: "bay-bay", tagalog: "Dagat", english: "Ocean/Sea", example: "Ilocano: Masarap magpahinga sa <b>Baybay</b>.", image: "../assets/images/ocean.png", audio: "../assets/audio/baybay.mp3" },
            { cat: "Nature", dialect: "Karayan", pron: "ka-ra-yan", tagalog: "Ilog", english: "River", example: "Ilocano: Tumawid kami sa <b>Karayan</b> kahapon.", image: "../assets/images/river.png", audio: "../assets/audio/karayan.mp3" },
            { cat: "Nature", dialect: "Kayú", pron: "ka-yu", tagalog: "Puno", english: "Tree", example: "Ilocano: May malaking <b>Kayú</b> sa harap ng bahay.", image: "../assets/images/tree.png", audio: "../assets/audio/kayu.mp3" }
        ];

        const container = document.getElementById("flashcards");
        let currentIndex = 0;
        let lastCat = "";

        // Render Grid
        words.forEach((w, i) => {
            if (w.cat !== lastCat) {
                const div = document.createElement("div");
                div.className = "section-divider";
                div.innerHTML = `<span class="material-icons">label</span> ${w.cat}`;
                container.appendChild(div);
                lastCat = w.cat;
            }

            const card = document.createElement("div");
            card.className = "flashcard";
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="upper-text">${w.dialect}</div>
                        <div class="separator"></div>
                        <div class="lower-text">[ ${w.pron} ]</div>
                    </div>
                    <div class="card-back">
                        <div class="upper-text">${w.tagalog}</div>
                        <div class="separator"></div>
                        <div class="lower-text">${w.english}</div>
                    </div>
                </div>`;
            card.onclick = () => {
                currentIndex = i;
                showDetails();
            };
            container.appendChild(card);
        });

        function showDetails() {
            document.getElementById("flashcards").style.display = "none";
            document.getElementById("mainHeader").style.display = "none";
            document.getElementById("details").style.display = "block";
            displayWord();
        }

        function displayWord() {
            const w = words[currentIndex];
            document.getElementById("dialectWord").innerText = w.dialect;
            document.getElementById("pronunciationText").innerText = `[ ${w.pron} ]`;
            document.getElementById("tagalogWord").innerText = "Tagalog: " + w.tagalog;
            document.getElementById("englishText").innerText = "English Definition: " + w.english;
            document.getElementById("exampleText").innerHTML = w.example;
            document.getElementById("wordImage").src = w.image;

            // Audio logic
            const audio = document.getElementById("audioElement");
            audio.src = w.audio;
            document.getElementById("playBtn").onclick = () => audio.play();
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % words.length;
            displayWord();
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            displayWord();
        }

        function goBack() {
            document.getElementById("flashcards").style.display = "grid";
            document.getElementById("mainHeader").style.display = "flex";
            document.getElementById("details").style.display = "none";
        }

        // Flip All functionality
        document.getElementById('flipAllBtn').onclick = function () {
            const cards = document.querySelectorAll('.flashcard');
            const isFlipped = cards[0].classList.contains('flipped');
            cards.forEach(c => c.classList.toggle('flipped', !isFlipped));
            this.textContent = !isFlipped ? "🙈 Hide All" : "👀 Show All";
        };

        // Entrance animation
        window.onload = () => {
            setTimeout(() => {
                document.querySelector('.learn_pampanga').classList.add('show');
            }, 100);
        };
    </script>
</body>

</html>
